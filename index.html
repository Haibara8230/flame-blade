<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080a14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>命运 · DESTINY</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🔥</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <canvas id="cv" width="960" height="540"></canvas>

  <!-- ============ HUD ============ -->
  <header id="hud" class="hidden">
    <div class="hud-left">
      <span id="hud-chapter">序章</span>
    </div>
    <div class="hud-right">
      <button class="hbtn" id="btn-full" title="全屏">⛶</button>
      <!-- 仅 ?debug=1 时显示：场景跳转菜单 -->
      <button class="hbtn hidden" id="btn-jump" title="场景跳转（调试）">⚑ 跳转</button>
      <button class="hbtn" id="btn-status">◈ 队伍</button>
      <button class="hbtn" id="btn-bag">◆ 道具</button>
      <button class="hbtn" id="btn-save">◇ 存档</button>
      <button class="hbtn" id="btn-title">✦ 标题</button>
    </div>
  </header>

  <!-- ============ 对话框 ============ -->
  <div id="dialogue" class="hidden">
    <div class="dlg-portrait"><img id="dlg-img" alt=""></div>
    <div class="dlg-main">
      <div class="dlg-name"><span id="dlg-name-text"></span></div>
      <div class="dlg-text" id="dlg-text"></div>
      <!-- 快进：点一下连续推进，再点停；键盘按住 Ctrl 同效。
           遇到选项、战斗、载入画面会自动停下。 -->
      <button class="dlg-skip" id="btn-skip" title="快进（或按住 Ctrl）">▶▶ 跳过</button>
      <div class="dlg-next" id="dlg-next">▼</div>
    </div>
  </div>

  <!-- ============ 全身立绘（站位） ============
       全身图不塞进对话框里那个 126×136 的小框——塞进去脸只剩几个像素。
       改成像视觉小说那样站在舞台上，脚被对话框挡住（z-index 24 < 对话框的 25）。
       半身图仍然走对话框里的小框，由图片自身的高宽比自动选（见 main.js setPortrait）。
       ⚠ 必须排在 #dialogue **后面**：CSS 没有「前一个兄弟」选择器，
       靠 `#dialogue.hidden ~ #standee` 这条规则让立绘跟着对话框一起收起来，
       否则战斗、面板、标题画面里它会一直杵在那。 -->
  <div id="standee" class="hidden"><img id="standee-img" alt=""></div>

  <!-- ============ 抉择 ============ -->
  <div id="choices" class="hidden">
    <div class="choices-title">— 做出你的选择 —</div>
    <div id="choices-list"></div>
  </div>

  <!-- ============ 战斗指令 ============ -->
  <div id="cmdmenu" class="hidden">
    <div class="battle-log" id="battle-log"></div>
    <div class="cmd-row">
      <div class="cmd-actor" id="cmd-actor"></div>
      <div class="cmd-buttons" id="cmd-buttons"></div>
    </div>
  </div>

  <!-- ============ 奥义演出 ============ -->
  <div id="cutin" class="hidden">
    <div class="cutin-speed"></div>
    <div class="cutin-band">
      <img id="cutin-img" alt="">
      <div class="cutin-text"><span id="cutin-name"></span></div>
    </div>
  </div>

  <!-- 全屏视觉特效层 -->
  <div id="flash"></div>
  <div id="vignette"></div>
  <div id="tint"></div>
  <div id="dmgvignette"></div>
  <div id="hotoverlay"></div>

  <!-- ============ 角色面板 ============ -->
  <div id="panel" class="hidden">
    <div class="panel-head"><span id="panel-title">队伍状态</span><button class="hbtn" id="panel-close">✕ 关闭</button></div>
    <div class="panel-body" id="panel-body"></div>
  </div>

  <!-- ============ 标题画面 ============ -->
  <div id="title" class="screen">
    <div class="title-glow"></div>
    <div class="title-inner">
      <div class="title-en">DESTINY</div>
      <h1 class="title-cn">命 运</h1>
      <div class="title-sub">— 人生可以是游戏，但千万不要试图去游戏你的人生 —</div>
      <div class="title-menu">
        <button class="tbtn" id="btn-new">开始新角色</button>
        <button class="tbtn" id="btn-continue">继续游戏</button>
        <button class="tbtn" id="btn-chapters">章节选择</button>
        <button class="tbtn" id="btn-gallery">技能一览</button>
        <button class="tbtn" id="btn-help">操作说明</button>
      </div>
      <div class="title-foot">第一卷 · 序章 ~ 第十一章「永恒命运之刻」</div>
    </div>
  </div>

  <!-- ============ 载入画面 ============ -->
  <div id="loading" class="screen hidden">
    <div class="title-glow"></div>
    <div class="loading-inner">
      <h2 id="load-chapter">序章</h2>
      <p id="load-text">命运正在转动……</p>
    </div>
  </div>

  <!-- ============ 结局画面 ============ -->
  <div id="ending" class="screen hidden">
    <div id="ending-bg"></div>
    <div class="ending-inner">
      <div class="ending-label" id="ending-label">TRUE END</div>
      <h2 id="ending-title"></h2>
      <p id="ending-text"></p>
      <div class="title-menu">
        <button class="tbtn" id="btn-again">再战一次</button>
      </div>
    </div>
  </div>

  <!-- ============ 提示气泡 ============ -->
  <div id="toast"></div>

  <!-- ============ 竖屏提示 ============ -->
  <div id="rotate" class="hidden">
    <div class="rotate-icon">📱</div>
    <div class="rotate-title">请把手机横过来</div>
    <div class="rotate-sub">本作是横屏游戏，横屏后画面更大、战斗指令更清楚</div>
  </div>
</div>

<!-- 日漫风格音效（WebAudio 程序化合成，无需外部素材） -->
<script type="module" src="js/main.js"></script>
</body>
</html>
